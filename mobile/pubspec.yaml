name: lifekart_mobile
description: "LifeKart — Lock in wholesale prices for 60 years."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0

  # State Management
  flutter_riverpod: ^2.4.9

  # Networking
  dio: ^5.4.0
  pretty_dio_logger: ^1.4.0

  # Navigation
  go_router: ^12.1.1

  # Storage & Security
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3

  # Data Visualization
  fl_chart: ^0.65.0

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
